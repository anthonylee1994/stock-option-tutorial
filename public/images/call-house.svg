<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240"
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <style>
        .float { animation: float 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        .float-late { animation: float 3.2s ease-in-out 1.1s infinite; transform-box: fill-box; transform-origin: center; }
        .glow { animation: glow 2.6s ease-in-out infinite; }
        .tilt { animation: tilt 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
        .tick { animation: tick 4s steps(12) infinite; transform-box: view-box; transform-origin: 300px 46px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
        @keyframes tilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(2deg); } }
        @keyframes tick { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <defs>
        <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4dabf7" />
            <stop offset="1" stop-color="#2f7fc4" />
        </linearGradient>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#22304d" />
            <stop offset="1" stop-color="#18223a" />
        </linearGradient>
        <radialGradient id="coin" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0" stop-color="#ffe08a" />
            <stop offset="1" stop-color="#d9a21b" />
        </radialGradient>
    </defs>

    <ellipse cx="120" cy="214" rx="104" ry="10" fill="#000" opacity="0.35" />

    <!-- 房子 -->
    <rect x="132" y="52" width="16" height="34" rx="2" fill="#2a3a5c" />
    <rect x="44" y="104" width="152" height="108" rx="6" fill="url(#wall)" stroke="#4dabf7"
        stroke-opacity="0.45" />
    <polygon points="30,110 120,42 210,110" fill="url(#roof)" />
    <rect x="102" y="152" width="36" height="60" rx="4" fill="#0f1729" stroke="#4dabf7"
        stroke-opacity="0.4" />
    <circle cx="131" cy="184" r="2.5" fill="#f2c14e" />
    <rect class="glow" x="60" y="124" width="30" height="26" rx="3" fill="#f2c14e" />
    <rect class="glow" x="150" y="124" width="30" height="26" rx="3" fill="#f2c14e"
        style="animation-delay: 1.3s" />
    <path d="M75 124v26M60 137h30M165 124v26M150 137h30" stroke="#18223a" stroke-width="2" />

    <!-- 价格牌 -->
    <g class="tilt">
        <line x1="62" y1="88" x2="62" y2="62" stroke="#9aabc7" stroke-width="2" />
        <rect x="22" y="40" width="80" height="26" rx="6" fill="#151d30" stroke="#9aabc7"
            stroke-opacity="0.6" />
        <text x="62" y="58" fill="#e8eefb" font-size="13" font-weight="700" text-anchor="middle">现价
            100 万</text>
    </g>

    <!-- 合约 -->
    <g class="float">
        <rect x="228" y="78" width="104" height="132" rx="8" fill="#e8eefb" />
        <rect x="228" y="78" width="104" height="26" rx="8" fill="#37d67a" />
        <rect x="228" y="94" width="104" height="10" fill="#37d67a" />
        <text x="280" y="96" fill="#08131f" font-size="12" font-weight="800" text-anchor="middle">认购权
            CALL</text>
        <text x="242" y="124" fill="#4a5875" font-size="10">买入价</text>
        <text x="318" y="124" fill="#0b1220" font-size="12" font-weight="800" text-anchor="end">100
            万</text>
        <text x="242" y="144" fill="#4a5875" font-size="10">有效期</text>
        <text x="318" y="144" fill="#0b1220" font-size="12" font-weight="800" text-anchor="end">3 个月</text>
        <line x1="242" y1="156" x2="318" y2="156" stroke="#c4cde0" />
        <text x="242" y="174" fill="#4a5875" font-size="10">订金（权利金）</text>
        <text x="318" y="194" fill="#d9a21b" font-size="16" font-weight="800" text-anchor="end">2 万</text>
    </g>

    <!-- 金币 -->
    <g class="float-late">
        <circle cx="222" cy="188" r="17" fill="url(#coin)" stroke="#b9860f" stroke-width="2" />
        <text x="222" y="194" fill="#7a5600" font-size="16" font-weight="800" text-anchor="middle">¥</text>
    </g>

    <!-- 时钟 -->
    <circle cx="300" cy="46" r="20" fill="#151d30" stroke="#4dabf7" stroke-width="2" />
    <line class="tick" x1="300" y1="46" x2="300" y2="32" stroke="#4dabf7" stroke-width="2.5"
        stroke-linecap="round" />
    <line x1="300" y1="46" x2="310" y2="46" stroke="#9aabc7" stroke-width="2" stroke-linecap="round" />
    <circle cx="300" cy="46" r="2.5" fill="#4dabf7" />
</svg>